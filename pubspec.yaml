name: agreg_master
description: Application de fiches de cours pour l'agrégation (Algèbre, Analyse).
publish_to: 'none'
version: 1.0.0+5

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_markdown: ^0.7.4+1
  flutter_markdown_latex: ^0.3.4
  flutter_math_fork: ^0.7.2
  google_fonts: ^6.2.1
  path_provider: ^2.1.5
  pdf: ^3.10.8
  printing: ^5.12.0
  share_plus: ^10.1.0
  fl_chart: ^0.66.2
  url_launcher: ^6.2.4
  intl: ^0.19.0
  table_calendar: ^3.0.9
  shared_preferences: ^2.2.2
  connectivity_plus: ^6.1.3
  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_analytics: ^11.3.3
  firebase_crashlytics: ^4.1.3
  # In-App Purchase
  in_app_purchase: ^3.2.0
  in_app_purchase_storekit: ^0.3.17+3
  in_app_purchase_android: ^0.3.6+3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fiches/
    - assets/fiches/algebre/
    - assets/fiches/analyse/
    - assets/fiches/probabilites/      
    - assets/fiches/geometrie/ 
    - assets/data/
    - assets/glossaire.json

    
