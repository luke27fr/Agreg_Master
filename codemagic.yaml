workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Agreg Master
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - keystore_credentials
    scripts:
      - name: Set up Firebase config for iOS
        script: |
          echo $GOOGLE_SERVICE_INFO_PLIST | base64 --decode > "$CM_BUILD_DIR/ios/Runner/GoogleService-Info.plist"

      - name: Get Flutter packages
        script: flutter packages pub get

      - name: Set up code signing
        script: |
          keychain initialize
          
          # Fetch or create the provisioning profile and certificates
          app-store-connect fetch-signing-files com.agregmaster.app --type IOS_APP_STORE --create
          keychain add-certificates
          
          # Find the downloaded profile and extract metadata
          PROFILE_PATH=$(ls ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision | head -1)
          PROFILE_UUID=$(basename "$PROFILE_PATH" .mobileprovision)
          DECODED=$(security cms -D -i "$PROFILE_PATH")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /dev/stdin <<< "$DECODED")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.developer.team-identifier" /dev/stdin <<< "$DECODED")
          
          echo "=== Code Signing Details ==="
          echo "Team ID: $TEAM_ID"
          echo "Profile Name: $PROFILE_NAME"
          echo "Profile UUID: $PROFILE_UUID"
          
          # Inject signing settings directly into Flutter's Release xcconfig
          # This forces Xcode to use the exact profile we just downloaded
          cat >> "$CM_BUILD_DIR/ios/Flutter/Release.xcconfig" <<EOF
          CODE_SIGN_STYLE=Manual
          DEVELOPMENT_TEAM=$TEAM_ID
          PROVISIONING_PROFILE_SPECIFIER=$PROFILE_NAME
          PROVISIONING_PROFILE=$PROFILE_UUID
          CODE_SIGN_IDENTITY=Apple Distribution
          EOF
          
          # Create ExportOptions.plist required by flutter build ipa
          cat > "$CM_BUILD_DIR/export_options.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.agregmaster.app</key>
              <string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Build IPA
        script: |
          # Build the IPA using standard Flutter tools, pointing to our ExportOptions
          flutter build ipa --release --export-options-plist="$CM_BUILD_DIR/export_options.plist"

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  android-release:
    name: Android Release
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: stable
      java: 17
      groups:
        - keystore_credentials
    scripts:
      - name: Set up keystore
        script: |
          echo $CM_KEYSTORE | base64 --decode > $CM_BUILD_DIR/android/app/agreg-master-release.jks
          cat >> "$CM_BUILD_DIR/android/key.properties" <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=agreg-master-release.jks
          EOF

      - name: Get Flutter packages
        script: flutter packages pub get

      - name: Flutter build AAB
        script: |
          # Affiche le SHA-1 du keystore
          keytool -list -v -keystore android/app/agreg-master-release.jks -storepass $CM_KEYSTORE_PASSWORD -alias $CM_KEY_ALIAS | grep "SHA1:" || true
          
          flutter build appbundle --release

    artifacts:
      - build/app/outputs/bundle/release/*.aab
