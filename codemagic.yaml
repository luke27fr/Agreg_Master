workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Agreg Master
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - keystore_credentials
    scripts:
      - name: Set up Firebase config for iOS
        script: |
          echo $GOOGLE_SERVICE_INFO_PLIST | base64 --decode > "$CM_BUILD_DIR/ios/Runner/GoogleService-Info.plist"

      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files com.agregmaster.app --type IOS_APP_STORE
          keychain add-certificates

          echo "=== Signing identities ==="
          security find-identity -v -p codesigning

          echo "=== Provisioning profiles ==="
          for f in ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision; do
            DECODED=$(/usr/bin/security cms -D -i "$f" 2>/dev/null)
            NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /dev/stdin <<< "$DECODED" 2>/dev/null)
            UUID=$(basename "$f" .mobileprovision)
            echo "  Profile: $NAME (UUID: $UUID)"
            echo "  --- Entitlements ---"
            /usr/libexec/PlistBuddy -c "Print :Entitlements" /dev/stdin <<< "$DECODED" 2>/dev/null || echo "    (could not read entitlements)"
            echo "  ---"
          done

      - name: Get Flutter packages
        script: flutter packages pub get

      - name: Build iOS
        script: flutter build ios --release --no-codesign

      - name: Create IPA
        script: |
          # Find provisioning profile
          PROFILE_PATH=$(ls ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision 2>/dev/null | head -1)
          PROFILE_UUID=$(basename "$PROFILE_PATH" .mobileprovision)
          DECODED=$(/usr/bin/security cms -D -i "$PROFILE_PATH")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /dev/stdin <<< "$DECODED")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.developer.team-identifier" /dev/stdin <<< "$DECODED")
          echo "Profile UUID: $PROFILE_UUID"
          echo "Profile Name: $PROFILE_NAME"
          echo "Team ID: $TEAM_ID"

          # Patch project.pbxproj to set profile for Release config
          PBXPROJ="$CM_BUILD_DIR/ios/Runner.xcodeproj/project.pbxproj"
          sed -i '' "s/PROVISIONING_PROFILE_SPECIFIER = .*/PROVISIONING_PROFILE_SPECIFIER = \"$PROFILE_NAME\";/" "$PBXPROJ" || true
          # If not already present, add it after CODE_SIGN_STYLE = Manual
          if ! grep -q "PROVISIONING_PROFILE_SPECIFIER" "$PBXPROJ"; then
            sed -i '' "/CODE_SIGN_STYLE = Manual;/a\\
                PROVISIONING_PROFILE_SPECIFIER = \"$PROFILE_NAME\";" "$PBXPROJ"
          fi

          echo "=== Checking pbxproj signing settings ==="
          grep -A2 "CODE_SIGN_STYLE\|PROVISIONING_PROFILE\|DEVELOPMENT_TEAM" "$PBXPROJ" || true

          # Archive
          xcodebuild -workspace "$CM_BUILD_DIR/ios/Runner.xcworkspace" \
            -scheme Runner \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$CM_BUILD_DIR/build/ios/archive/Runner.xcarchive" \
            archive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            COMPILER_INDEX_STORE_ENABLE=NO

          # Create export options plist (base64-encoded to avoid YAML parsing issues)
          echo "" | base64 --decode > /tmp/ExportOptions.plist

          echo "=== Export Options ==="
          cat /tmp/ExportOptions.plist

          # Export IPA
          mkdir -p "$CM_BUILD_DIR/build/ios/ipa"
          xcodebuild -exportArchive \
            -archivePath "$CM_BUILD_DIR/build/ios/archive/Runner.xcarchive" \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -exportPath "$CM_BUILD_DIR/build/ios/ipa"

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  android-release:
    name: Android Release
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: stable
      java: 17
      groups:
        - keystore_credentials
    scripts:
      - name: Set up keystore
        script: |
          echo $CM_KEYSTORE | base64 --decode > $CM_BUILD_DIR/android/app/agreg-master-release.jks
          cat >> "$CM_BUILD_DIR/android/key.properties" <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=agreg-master-release.jks
          EOF

      - name: Get Flutter packages
        script: flutter packages pub get

      - name: Flutter build AAB
        script: flutter build appbundle --release

    artifacts:
      - build/app/outputs/bundle/release/*.aab

    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
